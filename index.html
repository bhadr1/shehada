<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء شهادة PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            direction: rtl; 
        }
        canvas {
            display: none; 
        }
    </style>
</head>
<body class="bg-[#003463] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-4xl font-extrabold text-[#003463] mb-6 tracking-tight">
            إنشاء شهادة
        </h1>
        <p class="text-gray-600 mb-8 text-lg">
            أدخل اسمك ورمز الدورة لطباعة شهادتك.
        </p>

        <div class="mb-6 text-right">
            <label for="userName" class="block text-gray-700 text-sm font-medium mb-2">
                الاسم الكامل:
            </label>
            <input
                type="text"
                id="userName"
                placeholder="أدخل اسمك هنا..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="certificateCode" class="block text-gray-700 text-sm font-medium mb-2">
                رمز الدورة:
            </label>
            <input
                type="text"
                id="certificateCode"
                placeholder="أدخل الرمز هنا (مثال: 147)..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="languageSelect" class="block text-gray-700 text-sm font-medium mb-2">
                اختار اللغة / Choose Language:
            </label>
            <select
                id="languageSelect"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            >
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>

        <button
            id="generatePdfBtn"
            class="w-full bg-[#0090de] hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-2 focus:ring-[#0090de] focus:ring-opacity-75"
        >
            طباعة أو تحميل الشهادة
        </button>

        <canvas id="certificateCanvas" width="3200" height="2400"></canvas> 
    </div>

    <script>
        const userNameInput = document.getElementById('userName');
        const certificateCodeInput = document.getElementById('certificateCode');
        const languageSelect = document.getElementById('languageSelect');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const certificateCanvas = document.getElementById('certificateCanvas');
        const ctx = certificateCanvas.getContext('2d');

        const SCALE_FACTOR = 4;
        
        const validCodes = {
            '147': { ar: 'أساسيات البرمجة', en: 'Programming Fundamentals' },
            '258': { ar: 'التسويق الرقمي المتقدم', en: 'Advanced Digital Marketing' },
            '369': { ar: 'إدارة المشاريع الاحترافية', en: 'Professional Project Management' },
            '789': { ar: 'تصميم واجهات المستخدم', en: 'User Interface Design' }
        };


        const textStrings = {
            ar: {
                title: 'شهادة تقدير',
                authorityStatement1: 'تشهد إدارة جامعيون',
                authorityStatement2: 'ممثلة برئيسها',
                presidentName: 'بدر فرحان',
                proudCompletion: 'بكل فخر واعتزاز إتمام',
                requirementsStatement: 'المتطلبات اللازمة للحصول على الشهادة في',
                signatureLabel: 'توقيع',
                issueDateLabel: 'تاريخ الإصدار'
            },
            en: {
                title: 'Certificate of Completion',
                authorityStatement1: 'The management of Jamioun App,',
                authorityStatement2: 'represented by its president',
                presidentName: 'Bader Farhan',
                proudCompletion: 'hereby proudly certifies the successful completion by',
                requirementsStatement: 'of the requirements for obtaining the certificate in',
                signatureLabel: 'Signature',
                issueDateLabel: 'Issue Date'
            }
        };

      
        
        const waitForDelay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const maxRetries = 3;


        async function loadLogo() {
            
            const logoUrl = './assets/img/logo-jamii.png'; 
            const logo = new Image();
            logo.src = logoUrl;
            
            return new Promise((resolve, reject) => {
                logo.onload = () => resolve(logo);
                logo.onerror = () => reject(new Error("Failed to load logo image."));
            });
        }
        

        function drawStar(cx, cy, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / 5;

            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.closePath();
            ctx.fill();
        }


        function drawDiagonalLines(canvasWidth, canvasHeight) {
            ctx.strokeStyle = '#f0f9ff'; 
            ctx.lineWidth = 0.8 * SCALE_FACTOR;
            const stripeSpacing = 30 * SCALE_FACTOR; 
            for (let i = 0; i < (canvasWidth + canvasHeight) / stripeSpacing; i++) {
                ctx.beginPath();
                ctx.moveTo(i * stripeSpacing, 0);
                ctx.lineTo(0, i * stripeSpacing);
                ctx.stroke();
            }
        }


       
        async function drawCertificate(name, courseName, lang) {
            
            const texts = textStrings[lang];
            const canvasWidth = certificateCanvas.width;
            const canvasHeight = certificateCanvas.height;

           
            ctx.direction = (lang === 'ar' ? 'rtl' : 'ltr');

            
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
           
            drawDiagonalLines(canvasWidth, canvasHeight);

           
            ctx.strokeStyle = '#003463';
            ctx.lineWidth = 6 * SCALE_FACTOR; 
            ctx.strokeRect(0, 0, canvasWidth, canvasHeight);

            
            ctx.strokeStyle = '#0090de';
            ctx.lineWidth = 2.5 * SCALE_FACTOR; 
            
            
            ctx.beginPath();
            ctx.moveTo(40 * SCALE_FACTOR, 40 * SCALE_FACTOR); 
            ctx.lineTo(canvasWidth - (40 * SCALE_FACTOR), 40 * SCALE_FACTOR); 
            ctx.stroke();


           
            ctx.fillStyle = '#f0f9ff';
            ctx.strokeStyle = '#0090de';
            ctx.lineWidth = 1.5 * SCALE_FACTOR; 

          
            ctx.beginPath();
            ctx.arc(canvasWidth - (60 * SCALE_FACTOR), 60 * SCALE_FACTOR, 25 * SCALE_FACTOR, 0, 2 * Math.PI); // Scaled
            ctx.fill();
            ctx.stroke();

        
            ctx.beginPath();
            ctx.arc(60 * SCALE_FACTOR, 60 * SCALE_FACTOR, 25 * SCALE_FACTOR, 0, 2 * Math.PI); // Scaled
            ctx.fill();
            ctx.stroke();
            
           
            try {
                const logo = await loadLogo();
                
                let logoSize = 80 * SCALE_FACTOR;
                let logoMargin = 50 * SCALE_FACTOR;
                let logoX = logoMargin;
                if (lang === 'ar') {
                    logoX = canvasWidth - (130 * SCALE_FACTOR); 
                } else {
                    logoX = logoMargin; 
                }
                ctx.drawImage(logo, logoX, logoMargin, logoSize, logoSize); 
            } catch (error) {
                console.error(error.message);
            }

            ctx.fillStyle = '#003463';
            ctx.font = `900 ${48 * SCALE_FACTOR}px Inter, sans-serif`; // Scaled font size
            ctx.textAlign = 'center';
           
            ctx.fillText(texts.title, canvasWidth / 2, 90 * SCALE_FACTOR); 
            
          
            ctx.fillStyle = '#0090de'; 
            ctx.beginPath();
         
            ctx.moveTo(0, 150 * SCALE_FACTOR); 
            ctx.bezierCurveTo(canvasWidth * 0.25, 120 * SCALE_FACTOR, canvasWidth * 0.75, 120 * SCALE_FACTOR, canvasWidth, 150 * SCALE_FACTOR); 
            ctx.lineTo(canvasWidth, 170 * SCALE_FACTOR); 
            ctx.bezierCurveTo(canvasWidth * 0.75, 140 * SCALE_FACTOR, canvasWidth * 0.25, 140 * SCALE_FACTOR, 0, 170 * SCALE_FACTOR); 
            ctx.closePath();
            ctx.fill();

         
            ctx.fillStyle = '#003463';
          
            let currentY = 210 * SCALE_FACTOR; 
            const standardLineHeight = 30 * SCALE_FACTOR;
            const nameLineHeight = 50 * SCALE_FACTOR; 

            ctx.textAlign = 'center';

            ctx.font = `400 ${22 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.authorityStatement1, canvasWidth / 2, currentY);
            currentY += standardLineHeight;
            ctx.fillText(texts.authorityStatement2, canvasWidth / 2, currentY);
            currentY += standardLineHeight + (10 * SCALE_FACTOR); 


            ctx.font = `bold ${26 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.presidentName, canvasWidth / 2, currentY);
            currentY += nameLineHeight + (20 * SCALE_FACTOR); 


            ctx.font = `400 ${22 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.proudCompletion, canvasWidth / 2, currentY);
            currentY += standardLineHeight + (10 * SCALE_FACTOR); 


            ctx.font = `bold ${40 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillStyle = '#fdac13'; 
            ctx.fillText(name, canvasWidth / 2, currentY);


            const starY = currentY - (10 * SCALE_FACTOR); 
            const starSpacing = 160 * SCALE_FACTOR; 
            const starOuterRadius = 14 * SCALE_FACTOR; 
            const starInnerRadius = 6 * SCALE_FACTOR; 
            
            drawStar(canvasWidth / 2 + starSpacing, starY, starOuterRadius, starInnerRadius);
            drawStar(canvasWidth / 2 - starSpacing, starY, starOuterRadius, starInnerRadius);

            
            currentY += nameLineHeight + (10 * SCALE_FACTOR); 
            ctx.fillStyle = '#003463'; 

            
            ctx.font = `400 ${22 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.requirementsStatement, canvasWidth / 2, currentY);
            currentY += standardLineHeight + (15 * SCALE_FACTOR); 


            ctx.font = `bold ${32 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(courseName, canvasWidth / 2, currentY);
            

            

            const marginFromEdge = 100 * SCALE_FACTOR;
            const dateBlockX = lang === 'ar' ? marginFromEdge : canvasWidth - marginFromEdge; 
            const signatureBlockX = lang === 'ar' ? canvasWidth - marginFromEdge : marginFromEdge;
            const footerY = canvasHeight - (90 * SCALE_FACTOR); 


            const today = new Date('2025-09-27'); 
            const dateString = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
            
            ctx.textAlign = 'center';
            ctx.fillStyle = '#003463';

         
            
            ctx.font = `500 ${20 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.issueDateLabel, dateBlockX, footerY - (10 * SCALE_FACTOR)); 

           
            
            ctx.font = `bold ${24 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillStyle = '#0090de';
            ctx.fillText(`${dateString}`, dateBlockX, footerY + (20 * SCALE_FACTOR)); 
            ctx.fillStyle = '#003463'; 
            

            ctx.font = `500 ${20 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.signatureLabel, signatureBlockX, footerY - (10 * SCALE_FACTOR)); 
            
            
            ctx.strokeStyle = '#003463'; 
            ctx.lineWidth = 2 * SCALE_FACTOR; 
            ctx.beginPath();
            ctx.moveTo(signatureBlockX - (80 * SCALE_FACTOR), footerY + (15 * SCALE_FACTOR)); 
            ctx.lineTo(signatureBlockX + (80 * SCALE_FACTOR), footerY + (15 * SCALE_FACTOR)); 
            ctx.stroke();

           
            
            ctx.font = `bold ${22 * SCALE_FACTOR}px Inter, sans-serif`; 
            ctx.fillText(texts.presidentName, signatureBlockX, footerY + (45 * SCALE_FACTOR)); 
        }


        generatePdfBtn.addEventListener('click', () => {
            const userName = userNameInput.value.trim();
            const enteredCode = certificateCodeInput.value.trim();
            const selectedLanguage = languageSelect.value;

            if (!userName || !enteredCode) {
                displayMessage('الرجاء إدخال الاسم ورمز الدورة / Please enter your name and course code.', 'red');
                return;
            }

            const courseData = validCodes[enteredCode];
            if (!courseData) {
                displayMessage('رمز الدورة غير صحيح. الرجاء إدخال رمز صالح. / Invalid course code. Please enter a valid code.', 'red');
                return;
            }
            const courseName = courseData[selectedLanguage];


            drawCertificate(userName, courseName, selectedLanguage).then(() => {
                const { jsPDF } = window.jspdf;

                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [certificateCanvas.width, certificateCanvas.height] 
                });
                
                doc.addImage(certificateCanvas.toDataURL('image/png'), 'PNG', 0, 0, certificateCanvas.width, certificateCanvas.height);
                doc.save(`${selectedLanguage === 'ar' ? 'شهادة' : 'Certificate'}_${userName}.pdf`);


                displayMessage(
                    selectedLanguage === 'ar' ? 'تم بدء عملية تنزيل ملف PDF...' : 'PDF download process initiated...',
                    'green'
                );
            });
            
        });


        function displayMessage(message, type) {
            let messageBox = document.getElementById('messageBox');
            if (!messageBox) {
                messageBox = document.createElement('div');
                messageBox.id = 'messageBox';
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 transition-opacity duration-300';
                document.body.appendChild(messageBox);
            }

            messageBox.textContent = message;
            messageBox.style.opacity = '1';

            if (type === 'red') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-red-500 transition-opacity duration-300';
            } else if (type === 'green') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-green-500 transition-opacity duration-300';
            }

            if (messageBox.timeoutId) {
                clearTimeout(messageBox.timeoutId);
            }
            messageBox.timeoutId = setTimeout(() => {
                messageBox.style.opacity = '0';
            }, 3000);
        }
    </script>
</body>
</html>
