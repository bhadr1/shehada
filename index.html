<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء شهادة PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            direction: rtl; /* Default to Right-to-left for Arabic */
        }
        canvas {
            display: none; /* Hide the canvas, it's used for PDF generation */
        }
    </style>
</head>
<body class="bg-[#003463] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-4xl font-extrabold text-[#003463] mb-6 tracking-tight">
            إنشاء شهادة
        </h1>
        <p class="text-gray-600 mb-8 text-lg">
            أدخل اسمك ورمز الدورة لطباعة شهادتك.
        </p>

        <div class="mb-6 text-right">
            <label for="userName" class="block text-gray-700 text-sm font-medium mb-2">
                الاسم الكامل:
            </label>
            <input
                type="text"
                id="userName"
                placeholder="أدخل اسمك هنا..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="certificateCode" class="block text-gray-700 text-sm font-medium mb-2">
                رمز الدورة:
            </label>
            <input
                type="text"
                id="certificateCode"
                placeholder="أدخل الرمز هنا (مثال: 147)..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="languageSelect" class="block text-gray-700 text-sm font-medium mb-2">
                اختار اللغة / Choose Language:
            </label>
            <select
                id="languageSelect"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            >
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>

        <button
            id="generatePdfBtn"
            class="w-full bg-[#0090de] hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-2 focus:ring-[#0090de] focus:ring-opacity-75"
        >
            طباعة أو تحميل الشهادة
        </button>

        <canvas id="certificateCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        // Get references to elements
        const userNameInput = document.getElementById('userName');
        const certificateCodeInput = document.getElementById('certificateCode');
        const languageSelect = document.getElementById('languageSelect');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const certificateCanvas = document.getElementById('certificateCanvas');
        const ctx = certificateCanvas.getContext('2d');

        // Define valid certificate codes and their corresponding course names in both languages
        const validCodes = {
            '147': { ar: 'أساسيات البرمجة', en: 'Programming Fundamentals' },
            '258': { ar: 'التسويق الرقمي المتقدم', en: 'Advanced Digital Marketing' },
            '369': { ar: 'إدارة المشاريع الاحترافية', en: 'Professional Project Management' },
            '789': { ar: 'تصميم واجهات المستخدم', en: 'User Interface Design' }
        };

        // Text strings for different languages
        const textStrings = {
            ar: {
                title: 'شهادة إتمام',
                authorityStatement1: 'تشهد إدارة تطبيق جامعيون ممثلة برئيسها',
                presidentName: 'بدر فرحان',
                proudCompletion: 'بكل فخر واعتزاز إتمام',
                requirementsStatement: 'المتطلبات اللازمة للحصول على الشهادة في',
                signatureLabel: 'توقيع',
                issueDateLabel: 'تاريخ الإصدار:'
            },
            en: {
                title: 'Certificate of Completion',
                authorityStatement1: 'The management of Jamioun App, represented by its president',
                presidentName: 'Bader Farhan',
                proudCompletion: 'hereby proudly certifies the successful completion by',
                requirementsStatement: 'of the requirements for obtaining the certificate in',
                signatureLabel: 'Signature',
                issueDateLabel: 'Issue Date:'
            }
        };

        // Function to draw the certificate on the canvas
        function drawCertificate(name, courseName, lang) {
            // Get the appropriate text strings for the selected language
            const texts = textStrings[lang];

            // Set text direction for the canvas context based on language
            ctx.direction = (lang === 'ar' ? 'rtl' : 'ltr');

            // Clear previous drawings
            ctx.clearRect(0, 0, certificateCanvas.width, certificateCanvas.height);

            // Background color
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, certificateCanvas.width, certificateCanvas.height);

            // --- New Stylish Borders and Accent Lines ---
            // Outer blue border
            ctx.strokeStyle = '#003463';
            ctx.lineWidth = 15;
            ctx.strokeRect(0, 0, certificateCanvas.width, certificateCanvas.height);

            // Inner light blue rectangle
            ctx.fillStyle = '#eaf8ff'; // A very light tint of the blue
            ctx.fillRect(20, 20, certificateCanvas.width - 40, certificateCanvas.height - 40);

            // Decorative lines at the top and bottom
            ctx.strokeStyle = '#0090de';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(40, 40);
            ctx.lineTo(certificateCanvas.width - 40, 40);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(40, certificateCanvas.height - 40);
            ctx.lineTo(certificateCanvas.width - 40, certificateCanvas.height - 40);
            ctx.stroke();

            // --- Add Logo ---
            const logoUrl = 'https://i.imgur.com/Yw4B14g.png'; // 📌 قم بتغيير هذا الرابط إلى رابط شعارك 📌
            const logo = new Image();
            logo.src = logoUrl;
            
            logo.onload = () => {
                // Adjust position based on language
                let logoX = certificateCanvas.width - 150; // default for Arabic (right side)
                if (lang === 'en') {
                    logoX = 50; // for English (left side)
                }

                ctx.drawImage(logo, logoX, 60, 100, 100);
                drawTextContent(); // Call the function to draw text after the image is loaded
            };

            logo.onerror = () => {
                console.error("Failed to load logo image.");
                drawTextContent(); // Draw text content even if logo fails
            };
            
            // Function to draw all text content
            function drawTextContent() {
                // --- Certificate Title ---
                ctx.fillStyle = '#003463';
                ctx.font = 'bold 60px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(texts.title, certificateCanvas.width / 2, 120);

                // --- Main certificate text ---
                ctx.fillStyle = '#374151'; // Dark gray for main text
                let currentY = 220; // Starting Y position
                const standardLineHeight = 45;
                const nameLineHeight = 60;

                ctx.textAlign = 'center';

                // 1. Authority Statement
                ctx.font = '26px Inter, sans-serif';
                ctx.fillText(texts.authorityStatement1, certificateCanvas.width / 2, currentY);
                currentY += standardLineHeight;

                // 2. President's Name (bold and clear)
                ctx.font = 'bold 36px Inter, sans-serif';
                ctx.fillText(texts.presidentName, certificateCanvas.width / 2, currentY);
                currentY += nameLineHeight + 20;

                // 3. "proudly certifies the successful completion"
                ctx.font = '28px Inter, sans-serif';
                ctx.fillText(texts.proudCompletion, certificateCanvas.width / 2, currentY);
                currentY += standardLineHeight;

                // 4. User's Name (most prominent, distinct color)
                ctx.font = 'bold 48px Inter, sans-serif';
                ctx.fillStyle = '#fdac13'; // The new orange color
                ctx.fillText(name, certificateCanvas.width / 2, currentY);
                currentY += nameLineHeight + 20;

                // 5. Requirements Statement
                ctx.font = '28px Inter, sans-serif';
                ctx.fillStyle = '#374151'; // Reset color
                ctx.fillText(texts.requirementsStatement, certificateCanvas.width / 2, currentY);
                currentY += standardLineHeight;

                // 6. Course Name (prominent)
                ctx.font = 'bold 36px Inter, sans-serif';
                ctx.fillText(courseName, certificateCanvas.width / 2, currentY);
                currentY += nameLineHeight + 10;

                // --- Signature & Date Section ---
                const bottomAreaY = certificateCanvas.height - 80;
                ctx.textAlign = 'center';

                // Signature block
                ctx.fillStyle = '#003463';
                ctx.font = '22px Inter, sans-serif';
                let signatureBlockX = certificateCanvas.width - 200;
                if (lang === 'en') {
                    signatureBlockX = 200;
                }
                ctx.fillText(texts.signatureLabel, signatureBlockX, bottomAreaY);
                ctx.strokeStyle = '#003463';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(signatureBlockX - 100, bottomAreaY + 10);
                ctx.lineTo(signatureBlockX + 100, bottomAreaY + 10);
                ctx.stroke();
                ctx.font = 'bold 22px Inter, sans-serif';
                ctx.fillText(texts.presidentName, signatureBlockX, bottomAreaY + 40);

                // Date block
                ctx.fillStyle = '#6B7280';
                ctx.font = '18px Inter, sans-serif';
                let dateBlockX = 200;
                if (lang === 'en') {
                    dateBlockX = certificateCanvas.width - 200;
                }
                const today = new Date();
                const dateString = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
                ctx.fillText(texts.issueDateLabel, dateBlockX, bottomAreaY);
                ctx.fillText(`${dateString}`, dateBlockX, bottomAreaY + 30);
            }
        }

        // Event listener for the button
        generatePdfBtn.addEventListener('click', () => {
            const userName = userNameInput.value.trim();
            const enteredCode = certificateCodeInput.value.trim();
            const selectedLanguage = languageSelect.value;

            if (!userName || !enteredCode) {
                displayMessage('الرجاء إدخال الاسم ورمز الدورة / Please enter your name and course code.', 'red');
                return;
            }

            const courseData = validCodes[enteredCode];
            if (!courseData) {
                displayMessage('رمز الدورة غير صحيح. الرجاء إدخال رمز صالح. / Invalid course code. Please enter a valid code.', 'red');
                return;
            }
            const courseName = courseData[selectedLanguage];

            // Draw the certificate on the canvas
            drawCertificate(userName, courseName, selectedLanguage);

            // Wait for a brief moment to ensure the canvas drawing is complete
            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [certificateCanvas.width, certificateCanvas.height]
                });
                
                doc.addImage(certificateCanvas.toDataURL('image/png'), 'PNG', 0, 0, certificateCanvas.width, certificateCanvas.height);
                doc.save(`${selectedLanguage === 'ar' ? 'شهادة' : 'Certificate'}_${userName}.pdf`);

                displayMessage(
                    selectedLanguage === 'ar' ? 'تم إنشاء وتحميل الشهادة بنجاح!' : 'Certificate successfully generated and downloaded!',
                    'green'
                );
            }, 100); // Small delay to ensure the canvas is fully rendered, especially with the image
        });

        // Function to display a temporary message
        function displayMessage(message, type) {
            let messageBox = document.getElementById('messageBox');
            if (!messageBox) {
                messageBox = document.createElement('div');
                messageBox.id = 'messageBox';
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 transition-opacity duration-300';
                document.body.appendChild(messageBox);
            }

            messageBox.textContent = message;
            messageBox.style.opacity = '1';

            if (type === 'red') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-red-500 transition-opacity duration-300';
            } else if (type === 'green') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-green-500 transition-opacity duration-300';
            }

            if (messageBox.timeoutId) {
                clearTimeout(messageBox.timeoutId);
            }
            messageBox.timeoutId = setTimeout(() => {
                messageBox.style.opacity = '0';
            }, 3000);
        }
    </script>
</body>
</html>
