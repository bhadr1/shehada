<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء شهادة PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            direction: rtl; /* Default to Right-to-left for Arabic */
        }
        canvas {
            display: none; /* Hide the canvas, it's used for PDF generation */
        }
    </style>
</head>
<body class="bg-[#003463] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-4xl font-extrabold text-[#003463] mb-6 tracking-tight">
            إنشاء شهادة
        </h1>
        <p class="text-gray-600 mb-8 text-lg">
            أدخل اسمك ورمز الدورة لطباعة شهادتك.
        </p>

        <div class="mb-6 text-right">
            <label for="userName" class="block text-gray-700 text-sm font-medium mb-2">
                الاسم الكامل:
            </label>
            <input
                type="text"
                id="userName"
                placeholder="أدخل اسمك هنا..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="certificateCode" class="block text-gray-700 text-sm font-medium mb-2">
                رمز الدورة:
            </label>
            <input
                type="text"
                id="certificateCode"
                placeholder="أدخل الرمز هنا (مثال: 147)..."
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            />
        </div>

        <div class="mb-8 text-right">
            <label for="languageSelect" class="block text-gray-700 text-sm font-medium mb-2">
                اختار اللغة / Choose Language:
            </label>
            <select
                id="languageSelect"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0090de] transition duration-300 ease-in-out text-gray-800"
            >
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>

        <button
            id="generatePdfBtn"
            class="w-full bg-[#0090de] hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-2 focus:ring-[#0090de] focus:ring-opacity-75"
        >
            طباعة أو تحميل الشهادة
        </button>

        <!-- Canvas for drawing the certificate (A4 Landscape aspect ratio: 800x600 is roughly 4:3, for true A4 landscape 842x595, 800x566 is closer to the aspect ratio) -->
        <canvas id="certificateCanvas" width="800" height="600"></canvas> 
    </div>

    <script>
        // Get references to elements
        const userNameInput = document.getElementById('userName');
        const certificateCodeInput = document.getElementById('certificateCode');
        const languageSelect = document.getElementById('languageSelect');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const certificateCanvas = document.getElementById('certificateCanvas');
        const ctx = certificateCanvas.getContext('2d');

        // Define valid certificate codes and their corresponding course names in both languages
        const validCodes = {
            '147': { ar: 'أساسيات البرمجة', en: 'Programming Fundamentals' },
            '258': { ar: 'التسويق الرقمي المتقدم', en: 'Advanced Digital Marketing' },
            '369': { ar: 'إدارة المشاريع الاحترافية', en: 'Professional Project Management' },
            '789': { ar: 'تصميم واجهات المستخدم', en: 'User Interface Design' }
        };

        // Text strings for different languages
        const textStrings = {
            ar: {
                title: 'شهادة إتمام',
                authorityStatement1: 'تشهد إدارة تطبيق جامعيون',
                authorityStatement2: 'ممثلة برئيسها',
                presidentName: 'بدر فرحان',
                proudCompletion: 'بكل فخر واعتزاز إتمام',
                requirementsStatement: 'المتطلبات اللازمة للحصول على الشهادة في',
                signatureLabel: 'توقيع',
                issueDateLabel: 'تاريخ الإصدار'
            },
            en: {
                title: 'Certificate of Completion',
                authorityStatement1: 'The management of Jamioun App,',
                authorityStatement2: 'represented by its president',
                presidentName: 'Bader Farhan',
                proudCompletion: 'hereby proudly certifies the successful completion by',
                requirementsStatement: 'of the requirements for obtaining the certificate in',
                signatureLabel: 'Signature',
                issueDateLabel: 'Issue Date'
            }
        };

        // Helper function for exponential backoff (not strictly needed for local canvas, but good practice for external API calls)
        const waitForDelay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const maxRetries = 3;

        // Function to load the logo image with retry
        async function loadLogo() {
            const logoUrl = 'https://i.imgur.com/Yw4B14g.png'; // 📌 قم بتغيير هذا الرابط إلى رابط شعارك 📌
            const logo = new Image();
            logo.src = logoUrl;
            
            return new Promise((resolve, reject) => {
                logo.onload = () => resolve(logo);
                logo.onerror = () => reject(new Error("Failed to load logo image."));
            });
        }
        
        // Function to draw a 5-pointed star (symbol)
        function drawStar(cx, cy, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / 5;

            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.closePath();
            ctx.fill();
        }

        // Function to draw subtle diagonal background lines
        function drawDiagonalLines(canvasWidth, canvasHeight) {
            ctx.strokeStyle = '#f0f9ff'; // لون أبيض باهت جدًا
            ctx.lineWidth = 0.8;
            const stripeSpacing = 30;
            for (let i = 0; i < (canvasWidth + canvasHeight) / stripeSpacing; i++) {
                ctx.beginPath();
                ctx.moveTo(i * stripeSpacing, 0);
                ctx.lineTo(0, i * stripeSpacing);
                ctx.stroke();
            }
        }


        // Function to draw the certificate on the canvas
        async function drawCertificate(name, courseName, lang) {
            // Get the appropriate text strings for the selected language
            const texts = textStrings[lang];
            const canvasWidth = certificateCanvas.width;
            const canvasHeight = certificateCanvas.height;

            // Set text direction for the canvas context based on language
            ctx.direction = (lang === 'ar' ? 'rtl' : 'ltr');

            // Clear previous drawings
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // --- Stylish Borders and Decorative Elements ---
            
            // Background color (White as requested)
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // 1. Decorative subtle diagonal stripes (on the white background)
            drawDiagonalLines(canvasWidth, canvasHeight);

            // Outer dark blue border (refined thickness)
            ctx.strokeStyle = '#003463';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, canvasWidth, canvasHeight);

            // Inner light blue tinted area removed for a pure white background

            // Horizontal accent lines at top 
            ctx.strokeStyle = '#0090de';
            ctx.lineWidth = 2.5;
            
            // Top Accent Line
            ctx.beginPath();
            ctx.moveTo(40, 40);
            ctx.lineTo(canvasWidth - 40, 40);
            ctx.stroke();


            // Decorative circles (Corner only - removed bottom ones for cleaner footer)
            ctx.fillStyle = '#f0f9ff';
            ctx.strokeStyle = '#0090de';
            ctx.lineWidth = 1.5;

            // Top-right decorative circle (filled)
            ctx.beginPath();
            ctx.arc(canvasWidth - 60, 60, 25, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // Top-left decorative circle (filled)
            ctx.beginPath();
            ctx.arc(60, 60, 25, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // --- Add Logo ---
            try {
                const logo = await loadLogo();
                // Adjust position based on language (top-left or top-right)
                let logoX = 50;
                if (lang === 'ar') {
                    logoX = canvasWidth - 130; // Placed on the right for RTL layout
                } else {
                    logoX = 50; // Placed on the left for LTR layout
                }
                ctx.drawImage(logo, logoX, 50, 80, 80);
            } catch (error) {
                console.error(error.message);
            }

            // --- Draw Text Content ---
            
            // --- Certificate Title ---
            ctx.fillStyle = '#003463';
            ctx.font = '900 55px Inter, sans-serif'; // Used '900' for thicker font weight
            ctx.textAlign = 'center';
            ctx.fillText(texts.title, canvasWidth / 2, 100);
            
            // --- Poetic Wave / Ribbon Design ---
            ctx.fillStyle = '#0090de'; // Light blue color
            ctx.beginPath();
            // Start left
            ctx.moveTo(0, 160); 
            // Top control point creates a gentle curve upwards
            ctx.bezierCurveTo(canvasWidth * 0.25, 130, canvasWidth * 0.75, 130, canvasWidth, 160); 
            // Bottom edge of the ribbon
            ctx.lineTo(canvasWidth, 180); 
            ctx.bezierCurveTo(canvasWidth * 0.75, 150, canvasWidth * 0.25, 150, 0, 180); 
            ctx.closePath();
            ctx.fill();

            // --- Main certificate text ---
            ctx.fillStyle = '#003463'; // Dark blue for main text
            let currentY = 230; // Adjusted start Y position to be below the wave/ribbon
            const standardLineHeight = 35;
            const nameLineHeight = 58;

            ctx.textAlign = 'center';

            // 1. Authority Statement (split for better fit)
            ctx.font = '400 24px Inter, sans-serif';
            ctx.fillText(texts.authorityStatement1, canvasWidth / 2, currentY);
            currentY += standardLineHeight;
            ctx.fillText(texts.authorityStatement2, canvasWidth / 2, currentY);
            currentY += standardLineHeight + 10;

            // 2. President's Name (bold)
            ctx.font = 'bold 30px Inter, sans-serif';
            ctx.fillText(texts.presidentName, canvasWidth / 2, currentY);
            currentY += nameLineHeight + 15;

            // 3. Proud Completion
            ctx.font = '400 26px Inter, sans-serif';
            ctx.fillText(texts.proudCompletion, canvasWidth / 2, currentY);
            currentY += standardLineHeight + 10;

            // 4. User's Name (prominent, orange color)
            ctx.font = 'bold 46px Inter, sans-serif';
            ctx.fillStyle = '#fdac13'; // Orange color (البرتقالي)
            ctx.fillText(name, canvasWidth / 2, currentY);

            // --- Add Orange Stars/Flourishes around the name ---
            const starY = currentY - 15; // Vertical position adjustment
            const starSpacing = 160; // Distance from center
            const starOuterRadius = 15;
            const starInnerRadius = 6;
            
            // Draw stars near the name
            drawStar(canvasWidth / 2 + starSpacing, starY, starOuterRadius, starInnerRadius);
            drawStar(canvasWidth / 2 - starSpacing, starY, starOuterRadius, starInnerRadius);
            // ---------------------------------------------
            
            currentY += nameLineHeight + 20;
            ctx.fillStyle = '#003463'; // Reset color

            // 5. Requirements Statement
            ctx.font = '400 26px Inter, sans-serif';
            ctx.fillText(texts.requirementsStatement, canvasWidth / 2, currentY);
            currentY += standardLineHeight + 15;

            // 6. Course Name (prominent, bold, slightly larger)
            ctx.font = 'bold 38px Inter, sans-serif';
            ctx.fillText(courseName, canvasWidth / 2, currentY);
            
            // --- Signature & Date Section ---
            
            // New position: Use 100px margin from the edge
            const marginFromEdge = 100;
            const dateBlockX = lang === 'ar' ? marginFromEdge : canvasWidth - marginFromEdge; 
            const signatureBlockX = lang === 'ar' ? canvasWidth - marginFromEdge : marginFromEdge;
            const footerY = canvasHeight - 90;

            // Date calculation (Fixed date for certificate context)
            const today = new Date('2025-09-27'); 
            const dateString = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
            
            ctx.textAlign = 'center';
            ctx.fillStyle = '#003463';

            // --- Date Block ---
            
            // 1. Label
            ctx.font = '500 20px Inter, sans-serif';
            ctx.fillText(texts.issueDateLabel, dateBlockX, footerY - 10);

            // 2. Date Value (Highlighted)
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.fillStyle = '#0090de'; // Light blue for date
            ctx.fillText(`${dateString}`, dateBlockX, footerY + 20);
            ctx.fillStyle = '#003463'; // Reset
            
            // --- Signature Block ---

            // 1. Label
            ctx.font = '500 20px Inter, sans-serif';
            ctx.fillText(texts.signatureLabel, signatureBlockX, footerY - 10);
            
            // 2. Signature Line (thicker and darker)
            ctx.strokeStyle = '#003463'; 
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(signatureBlockX - 80, footerY + 15);
            ctx.lineTo(signatureBlockX + 80, footerY + 15);
            ctx.stroke();

            // 3. President's Name
            ctx.font = 'bold 22px Inter, sans-serif';
            ctx.fillText(texts.presidentName, signatureBlockX, footerY + 45);
        }

        // Event listener for the button
        generatePdfBtn.addEventListener('click', () => {
            const userName = userNameInput.value.trim();
            const enteredCode = certificateCodeInput.value.trim();
            const selectedLanguage = languageSelect.value;

            if (!userName || !enteredCode) {
                displayMessage('الرجاء إدخال الاسم ورمز الدورة / Please enter your name and course code.', 'red');
                return;
            }

            const courseData = validCodes[enteredCode];
            if (!courseData) {
                displayMessage('رمز الدورة غير صحيح. الرجاء إدخال رمز صالح. / Invalid course code. Please enter a valid code.', 'red');
                return;
            }
            const courseName = courseData[selectedLanguage];

            // Draw the certificate on the canvas
            drawCertificate(userName, courseName, selectedLanguage).then(() => {
                // IMPORTANT: The code is now structured to directly generate and download the PDF
                // without the 200ms delay and without showing a confirmation message.

                const { jsPDF } = window.jspdf;
                // Note: Dimensions are in pixels for jsPDF
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [certificateCanvas.width, certificateCanvas.height]
                });
                
                doc.addImage(certificateCanvas.toDataURL('image/png'), 'PNG', 0, 0, certificateCanvas.width, certificateCanvas.height);
                doc.save(`${selectedLanguage === 'ar' ? 'شهادة' : 'Certificate'}_${userName}.pdf`);

                // We can still display a quick confirmation that the download process started
                displayMessage(
                    selectedLanguage === 'ar' ? 'تم بدء عملية تنزيل ملف PDF...' : 'PDF download process initiated...',
                    'green'
                );
            });
           
        });

        // Function to display a temporary message (remains the same)
        function displayMessage(message, type) {
            let messageBox = document.getElementById('messageBox');
            if (!messageBox) {
                messageBox = document.createElement('div');
                messageBox.id = 'messageBox';
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 transition-opacity duration-300';
                document.body.appendChild(messageBox);
            }

            messageBox.textContent = message;
            messageBox.style.opacity = '1';

            if (type === 'red') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-red-500 transition-opacity duration-300';
            } else if (type === 'green') {
                messageBox.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg text-white font-medium z-50 bg-green-500 transition-opacity duration-300';
            }

            if (messageBox.timeoutId) {
                clearTimeout(messageBox.timeoutId);
            }
            messageBox.timeoutId = setTimeout(() => {
                messageBox.style.opacity = '0';
            }, 3000);
        }
    </script>
</body>
</html>
